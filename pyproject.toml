[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fncbale"
version = "0.1.36"
description = "Durable asynchronous Bale user-account client"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
dependencies = ["protobuf>=7.35.1,<8", "websockets>=15,<17", "httpx[http2]>=0.28,<1", "Pillow>=11", "av>=16"]
readme = "README.md"
authors = [{name = "milad ramezani", email = "ramezanimilad2004@gmail.com"}]
keywords = ["bale", "asyncio", "messaging", "protobuf", "user-account"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://milad01rmz.github.io/fncbale/"
Source = "https://github.com/milad01rmz/fncbale"
Issues = "https://github.com/milad01rmz/fncbale/issues"
Changelog = "https://github.com/milad01rmz/fncbale/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=1", "grpcio-tools>=1.84,<1.85", "build", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fncbale = ["py.typed", "proto/*.proto", "capabilities.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
exclude = ["research", ".venv", ".fncbale", "build", "src/fncbale/proto/*_pb2.py", "src/fncbale/proto/*_pb2.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
